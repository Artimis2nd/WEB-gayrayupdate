# ล้างสำเนาเก่าใน jsDelivr ทุกครั้งที่ push เข้า main
# เว็บ gayray.netlify.app ดึง games.json/รูปผ่าน cdn.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main
# ซึ่ง jsDelivr จำไว้ได้นานสุด 12 ชม. — สคริปต์นี้สั่งล้างให้ ของใหม่ขึ้นเว็บภายในไม่กี่นาที
name: Purge jsDelivr cache

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge games.json + changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, subprocess, urllib.parse, urllib.request, json, time

          before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
          files = {"games.json"}  # ล้างเสมอ — ป้ายเกมบนหน้าแรกมาจากไฟล์นี้
          if before and set(before) != {"0"}:
              out = subprocess.run(["git", "diff", "--name-only", before, after],
                                   capture_output=True, text=True).stdout
              files |= {f for f in out.splitlines() if f and not f.startswith(".github/")}

          purge_base = "https://purge.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main/"
          cdn_base = "https://cdn.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main/"

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read()

          def purge(f):
              for attempt in range(3):
                  try:
                      body = json.loads(fetch(purge_base + urllib.parse.quote(f)))
                      print(f"purge {body.get('status')}: {f}")
                      return
                  except Exception as e:
                      print(f"purge retry {attempt + 1}: {f} ({e})")
                      time.sleep(5)

          # ถ้าล้างทันทีหลัง push jsDelivr ยังไม่เห็น commit ใหม่ จะดึงไฟล์เก่ามาเก็บซ้ำ
          # (ทดสอบจริง 2026-09-26) — รอก่อน แล้วเช็คว่า games.json บน CDN ตรงกับ repo ถ้าไม่ตรงล้างซ้ำ
          time.sleep(30)
          for f in sorted(files):
              purge(f)

          want = subprocess.run(["git", "show", f"{after}:games.json"], capture_output=True).stdout
          for attempt in range(8):
              time.sleep(15)
              try:
                  got = fetch(cdn_base + "games.json")
              except Exception as e:
                  got = b""
                  print(f"fetch error: {e}")
              if got == want:
                  print(f"CDN games.json ตรงกับ repo แล้ว (รอบ {attempt + 1})")
                  break
              print(f"CDN games.json ยังเป็นของเก่า (รอบ {attempt + 1}) — ล้างซ้ำ")
              for f in sorted(files):
                  purge(f)
          else:
              raise SystemExit("CDN games.json ยังไม่ตรงกับ repo หลังลองซ้ำ 8 รอบ")
          EOF
