# ล้างสำเนาเก่าใน jsDelivr ทุกครั้งที่ push เข้า main
# เว็บ gayray.netlify.app ดึง games.json/รูปผ่าน cdn.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main
# ซึ่ง jsDelivr จำไว้ได้นานสุด 12 ชม. — สคริปต์นี้สั่งล้างให้ ของใหม่ขึ้นเว็บภายในไม่กี่นาที
name: Purge jsDelivr cache

on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge games.json + changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, subprocess, urllib.parse, urllib.request, json, time

          before, after = os.environ.get("BEFORE", ""), os.environ["AFTER"]
          files = {"games.json"}  # ล้างเสมอ — ป้ายเกมบนหน้าแรกมาจากไฟล์นี้
          if before and set(before) != {"0"}:
              out = subprocess.run(["git", "diff", "--name-only", before, after],
                                   capture_output=True, text=True).stdout
              files |= {f for f in out.splitlines() if f and not f.startswith(".github/")}

          purge_base = "https://purge.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main/"
          cdn_base = "https://cdn.jsdelivr.net/gh/Artimis2nd/WEB-gayrayupdate@main/"

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read()

          def purge(f):
              """คืนค่า วินาทีที่ต้องรอถ้าโดนระงับ (throttled) ไม่งั้น 0"""
              for attempt in range(3):
                  try:
                      body = json.loads(fetch(purge_base + urllib.parse.quote(f)))
                      info = next(iter(body.get("paths", {}).values()), {})
                      if info.get("throttled"):
                          print(f"purge THROTTLED: {f} (ล้างได้อีกใน {info.get('throttlingReset')} วิ)")
                          return info.get("throttlingReset") or 1
                      print(f"purge {body.get('status')}: {f}")
                      return 0
                  except Exception as e:
                      print(f"purge retry {attempt + 1}: {f} ({e})")
                      time.sleep(5)
              return 0

          def cdn_matches(want):
              try:
                  return fetch(cdn_base + "games.json") == want
              except Exception as e:
                  print(f"fetch error: {e}")
                  return False

          # บทเรียน (ทดสอบจริง 2026-09-26):
          # - ล้างทันทีหลัง push → jsDelivr ยังไม่เห็น commit ใหม่ ดึงไฟล์เก่ามาเก็บซ้ำ
          # - ล้างไฟล์เดิมถี่ๆ (9 ครั้งในไม่กี่นาที) → jsDelivr ระงับการล้างไฟล์นั้น ~50 นาที
          # → รอนานก่อนล้าง และล้างไม่เกิน 3 รอบ เว้นรอบละ 2 นาที
          want = subprocess.run(["git", "show", f"{after}:games.json"], capture_output=True).stdout
          time.sleep(90)
          for rnd in range(1, 4):
              if cdn_matches(want):
                  print(f"CDN games.json ตรงกับ repo แล้ว (ก่อนล้างรอบ {rnd})")
                  break
              throttled = max(purge(f) for f in sorted(files))
              if throttled:
                  raise SystemExit(f"jsDelivr ระงับการล้างชั่วคราว — ของใหม่จะขึ้นเองภายใน 12 ชม. "
                                   f"หรือกด Run workflow ในแท็บ Actions อีกครั้งหลัง {throttled} วิ")
              time.sleep(20)
              if cdn_matches(want):
                  print(f"CDN games.json ตรงกับ repo แล้ว (หลังล้างรอบ {rnd})")
                  break
              print(f"CDN games.json ยังเป็นของเก่าหลังล้างรอบ {rnd}")
              if rnd < 3:
                  time.sleep(120)
          else:
              raise SystemExit("CDN games.json ยังไม่ตรงกับ repo หลังล้าง 3 รอบ")
          EOF
